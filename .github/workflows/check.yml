name: Check website
on:
  push:
    branches-ignore: [main]
  # Keep required PR checks running even for documentation-only changes.
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch latest public challenges, solutions, notes, meetings and labs for this run
        run: npm run content:sync
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:community
      - run: npm run test:notes
      - run: npm run test:meetings
      - run: npm run test:labs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
