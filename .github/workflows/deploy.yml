name: Deploy production
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - LICENSING.md
      - LICENSE
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/check.yml
    with:
      production: true
  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download the tested production site
        uses: actions/download-artifact@v4
        with:
          name: tested-site
          path: dist
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify the published site before announcements
        run: npm run verify:deployment
      - name: Preserve the exact production publication manifest
        uses: actions/upload-artifact@v4
        with:
          name: production-publication-manifest
          path: dist/publication-manifest.json
          if-no-files-found: error
          retention-days: 90
  announce:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: production-publication-manifest
          path: publication
      - name: Announce the deployed publications
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_ANNOUNCEMENTS_WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_ANNOUNCEMENTS_WEBHOOK_URL" ]; then
            echo "Discord announcements are inactive. Initialize the baseline before configuring the webhook secret."
            exit 0
          fi
          node scripts/discord/announcements.mjs announce publication/publication-manifest.json
